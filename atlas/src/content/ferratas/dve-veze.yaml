name: Dve veže
country: SK
area: Záhorovo u Liptovskej Osady, rozhraní Nízkych Tatier a Velké Fatry
difficulty: B-D (9 tras, 20-70 m)
description: >
  První via ferrata na Liptově a čtvrtá na Slovensku (otevřena 2019).
  Tři skalní věže spojené lanovými mosty, s výhledy na Nízke Tatry
  i Velkou Fatru.
