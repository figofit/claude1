name: Bystrá lávka
country: SK
area: Mlynická a Furkotská dolina, Vysoké Tatry (od Štrbského plesa)
difficulty: středně těžká, exponovaná
description: >
  Náročný okruh přes Mlynickou a Furkotskou dolinu kolem vodopádu Skok,
  se závěrečným sedlem Bystrá lávka jištěným řetězy a kovovými stupy ve
  stylu via ferraty. Otevřeno jen v létě (1. 6. - 31. 10.).
