name: Alpenvereinssteig
country: AT
area: Rax, Höllental (od Weichtalhausu)
difficulty: B (stupnice rakouská)
coordinates: [15.7634, 47.7464]
description: >
  Jedna z nejstarších a nejznámějších via ferrat v masivu Rax, historická
  cesta z roku 1910. Vede z Höllentalu přes skalní stěny na náhorní
  plošinu Rax, se strmými žebříky v úvodní části.
