name: Intersport Klettersteig Donnerkogel
country: AT
area: Gosau / Dachstein West, Salzkammergut
difficulty: C/D
coordinates: [13.5219, 47.5522]
description: >
  Známá dlouhá ferrata se slavným "nebeským žebříkem" (Himmelsleiter) mezi
  skalami a výhledy na Gosausee. Při variantě od jezera bez lanovky jde
  o celodenní horskou akci, žebřík zdaleka není jejím koncem.
tags: [nebeský žebřík, dachstein]
