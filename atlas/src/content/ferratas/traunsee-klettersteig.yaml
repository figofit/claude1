name: Traunsee Klettersteig
country: AT
area: Gmunden, Salzkammergut
difficulty: D
targetPeak: traunstein
distanceKm: 1.25
description: >
  Velmi náročná via ferrata přes kolmý skalní pilíř na vrchol Traunsteinu
  nad jezerem Traunsee. Sestup přímo od Gmundner Hütte, s možností
  jednodušší cesty A/B zpátky.
