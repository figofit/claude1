name: Klettersteig Ruine Rabenstein
country: AT
area: St. Paul im Lavanttal, Korutansko
difficulty: C (stupnice rakouská)
coordinates: [14.8722, 46.6886]
distanceKm: 0.5
description: >
  Via ferrata na skále se zříceninou hradu Rabenstein (cca 1100), se
  dvěma lanovými mosty (Zweiseilbrücke, Nepalbrücke) a přelezem přes
  hradní zeď na závěr. Vhodná i pro začátečníky a rodiny.
