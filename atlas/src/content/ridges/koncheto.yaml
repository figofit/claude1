name: Koncheto
country: BG
range: Pirin
description: >
  Úzký mramorový hřeben (místy jen 0,5-0,7 m široký) spojující vrcholy
  Banski Suhodol a Kutelo poblíž Vihrenu - jedna z nejexponovanějších
  vysokohorských tras v Pirinu, často chozená jako okruh s výstupem na
  Vihren.
tags: [hřebenovka, exponovaná trasa]
