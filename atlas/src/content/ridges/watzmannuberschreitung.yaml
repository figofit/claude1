name: Watzmannüberschreitung
country: DE
range: Berchtesgadenské Alpy
description: >
  Slavný přechod hřebene Watzmannu přes Hocheck, Mittelspitze a Südspitze,
  běžně rozdělovaný do dvou dnů (cca 24 km, cca 2400 výškových metrů
  z Wimbachbrücke). Není to klasická souvisle jištěná ferrata - exponovaný
  terén, jištění jen místy.
tags: [hřebenovka, exponovaná trasa]
