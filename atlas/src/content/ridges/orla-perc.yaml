name: Orla Perć
country: PL
range: Vysoké Tatry
description: >
  Legendární hřebenová trasa v polských Tatrách, často označovaná za
  nejtěžší a nejexponovanější značenou turistickou stezku v Tatrách. Vede
  exponovaným terénem s řetězy, kramlemi a místy žebříkem.
tags: [hřebenovka, exponovaná trasa]
