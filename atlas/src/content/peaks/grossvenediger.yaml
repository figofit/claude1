name: Grossvenediger
country: AT
range: Vysoké Taury (Hohe Tauern)
elevation: 3657
coordinates: [12.34556, 47.10944]
description: >
  Nejvyšší hora skupiny Venediger ve Vysokých Taurách, na hlavním alpském
  hřebeni na hranici Východního Tyrolska a Salcburska. Výrazně zaledněná -
  ledovce Schlatenkees a Obersulzbachkees obepínají její úbočí. Považuje se
  za jednu z přístupnějších ledovcových třítisícovek v Alpách, i tak ale jde
  o vážnou túru s trhlinami a měnícími se podmínkami na ledovci.
tags: [ledovcová hora, alpská třítisícovka]
