name: Predné Solisko
country: SK
range: Vysoké Tatry
elevation: 1840
coordinates: [20.0006, 49.1494]
description: >
  Vrchol nad Štrbským Plesom ve Vysokých Tatrách. Zdroje se v přesné
  výšce trochu liší (od cca 1814 m horní stanice lanovky do cca 2093 m) -
  uvedená hodnota je nejčastěji citovaná výška samotného vrcholu.
