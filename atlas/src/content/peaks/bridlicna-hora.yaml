name: Břidličná hora
country: CZ
range: Hrubý Jeseník
elevation: 1358
coordinates: [17.187, 50.033]
description: >
  Vrchol na hlavním hřebeni Hrubého Jeseníku mezi Pecným a Jelením hřbetem,
  se sutěmi a kamennými moři. Od roku 2008 přírodní rezervace - vlastní
  vrchol je z důvodu ochrany přírody mimo přístup, hřebenem vede jen
  červeně značená cesta.
