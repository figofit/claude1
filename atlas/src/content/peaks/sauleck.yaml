name: Säuleck (Sauleck)
country: AT
range: Hohe Tauern (Ankogel Group)
elevation: 3086
coordinates: [13.1954, 47.0119]
description: >
  Vrchol ve skupině Ankogel v Hohe Tauern, přístupný z Mallnitz. Autorovi
  trvalo tři pokusy (2021, 2022, 2024), než na něm nakonec stanul - první
  dva zastavilo počasí, teprve třetí (s Marou Š.) byl úspěšný.
