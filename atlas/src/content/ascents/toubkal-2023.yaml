notes: >
  S placeným místním průvodcem Omarem, nahoru i dolů v jednom dni bez
  přespání na refugiu (cca 3150 m). Kolem 3900 m první výškovka v životě,
  zvládnutá s pomocí průvodce (pomalejší tempo, na chvíli převzal batoh).
  Vrchol 14:15-14:45. Blog udává datum výstupu 24. 5. 2023 shodně s dnem
  příletu do Marrákeše - časová posloupnost v článku je tedy dost natěsno.
