notes: >
  Sólo, pokračování od Pecného směrem k dalšímu, v moment zápisu do
  deníku blíže neurčenému vrcholu - podle polohy a popisu nejspíš
  Břidličná hora. Vlastní vrchol je ale od roku 2008 kvůli ochraně
  přírody mimo přístup, takže šlo nejvýš o průchod po značené cestě
  hřebenem. K Petrovým kamenům se pak už nedošlo, autor se otočil
  kvůli autu zaparkovanému na Skřítku.
