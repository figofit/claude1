notes: >
  Dvoudenní výstup z jihu (Hinterbichl). 1. den na Johannishütte (2121 m),
  přenocování. 2. den budík ve 4:00, odchod po 5:00 - nejdřív k Defreggerhausu
  (2962 m), cestou zbytečná odbočka nahoru přes 3200 m kvůli nedůvěře ve
  vlastní mapu. Pak ledovec na mačkách, proměnlivý sníh, orientace podle
  zkušenějších skupin kvůli trhlinám. Vrchol po cca 7-8 hodinách od ranního
  startu. Sestup horší než výstup - měknoucí sníh, jedna noha propadlá přesně
  nad trhlinou (bez zranění), na ledovci jsme byli mezi posledními. Zpět na
  Johannishütte odvoz autem od zaměstnankyně chaty. Bez GPS záznamu.
