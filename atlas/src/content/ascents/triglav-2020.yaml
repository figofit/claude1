notes: >
  Výstup trasou Pot čez Prag (první opravdu zajištěná vysokohorská cesta -
  kolíky, ocelové lano, klíčové místo cca 15 m stěna), noc na Triglavski dom
  na Kredarici (covidové omezení - noclehárna zavřená, přespáno v bundě pod
  schody). Druhý den výstup na vrchol přes hřeben Mali Triglav ještě před
  východem slunce, na vrcholu čtvrtý ten den. Sestup jinou trasou
  (Tominškova pot, viz samostatná route zpět do Mojstrany). Ferratový set
  s sebou, na hřebeni ale nepoužit. Bez GPS záznamu.
