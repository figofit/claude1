<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Statistiky | Moje hory</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="statistiky">

<header id="app-header" class="site-header"></header>

<main class="container">
  <h1>Statistiky</h1>
  <p class="page-lead">Počítáno automaticky z <code>data/ferraty.json</code>. Co nelze spolehlivě zjistit ze zapsaných dat, se nezobrazuje jako přesné číslo.</p>

  <div id="stat-row" class="stat-row"></div>

  <div class="stats-grid section">
    <div class="stats-card">
      <h3>Podle typu</h3>
      <div class="breakdown-list" id="by-type"></div>
    </div>
    <div class="stats-card">
      <h3>Podle země</h3>
      <div class="breakdown-list" id="by-country"></div>
    </div>
    <div class="stats-card">
      <h3>Podle obtížnosti</h3>
      <div class="breakdown-list" id="by-difficulty"></div>
    </div>
    <div class="stats-card">
      <h3>Podle roku</h3>
      <div class="breakdown-list" id="by-year"></div>
    </div>
    <div class="stats-card">
      <h3>Nejtěžší a další</h3>
      <div id="misc-stats"></div>
    </div>
  </div>
</main>

<footer id="app-footer" class="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/stats.js"></script>
</body>
</html>
