<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Moje hory — souhrn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  :root {
    --bg: #0a0b12;
    --bg2: #12141f;
    --surface: #1a1d2c;
    --border: rgba(255,255,255,0.08);
    --text: #f4f5f9;
    --text-muted: #9aa1b8;
    --text-faint: #6c7288;
    --accent: #5eead4;
    --accent-dim: #2d9c8f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: radial-gradient(120% 90% at 50% -10%, #16192a 0%, var(--bg) 55%);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    padding: 76px 76px 0;
  }

  .eyebrow {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow::before { content: "— "; }

  .title {
    font-size: 92px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.02;
    margin-top: 10px;
    color: var(--text);
  }

  .tagline {
    margin-top: 16px;
    font-size: 26px;
    font-weight: 400;
    color: var(--text-muted);
    max-width: 820px;
  }

  .hero {
    margin-top: 56px;
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .hero__value {
    font-size: 260px;
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -0.03em;
    color: var(--accent);
  }
  .hero__label {
    font-size: 38px;
    font-weight: 700;
    color: var(--text);
    padding-bottom: 18px;
  }

  .stats {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    position: relative;
    z-index: 2;
  }
  .stat {
    background: rgba(26, 29, 44, 0.72);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 22px;
    backdrop-filter: blur(2px);
  }
  .stat__value {
    font-size: 46px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.05;
  }
  .stat__label {
    margin-top: 6px;
    font-size: 19px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  .mountains {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 420px;
    z-index: 1;
    opacity: 0.9;
  }

  .footer {
    position: absolute;
    left: 76px;
    right: 76px;
    bottom: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }
  .footer__brand {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }
  .footer__brand span { color: var(--accent); }
  .footer__site {
    font-size: 20px;
    color: var(--text-faint);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="eyebrow">Osobní horský deník</div>
  <div class="title">Moje hory</div>
  <div class="tagline">Ferraty, vrcholy a hřebenovky — souhrn všeho, co jsem zatím zvládl v horách.</div>

  <div class="hero">
    <div class="hero__value">163</div>
    <div class="hero__label">výstupů</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat__value">30</div><div class="stat__label">zemí</div></div>
    <div class="stat"><div class="stat__value">5 047 m</div><div class="stat__label">nejvýš (Kazbek)</div></div>
    <div class="stat"><div class="stat__value">4</div><div class="stat__label">vrcholy nad 4000 m</div></div>
    <div class="stat"><div class="stat__value">12</div><div class="stat__label">vrcholy nad 3000 m</div></div>
    <div class="stat"><div class="stat__value">37</div><div class="stat__label">vrcholy nad 2500 m</div></div>
    <div class="stat"><div class="stat__value">2 600 m</div><div class="stat__label">nejtvrdší den (Wiesbachhorn)</div></div>
  </div>

  <svg class="mountains" viewBox="0 0 1080 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,420 L0,300 L140,190 L230,260 L340,120 L430,240 L560,80 L660,220 L760,160 L860,260 L960,150 L1080,240 L1080,420 Z" fill="#151827" opacity="0.9"/>
    <path d="M0,420 L0,340 L120,280 L220,330 L320,240 L420,310 L540,200 L640,300 L740,250 L860,320 L960,230 L1080,300 L1080,420 Z" fill="#1c2033"/>
    <path d="M0,420 L0,380 L160,340 L280,370 L400,320 L520,360 L640,310 L760,360 L880,330 L1000,370 L1080,350 L1080,420 Z" fill="#232842"/>
  </svg>

  <div class="footer">
    <div class="footer__brand">Moje<span>hory</span></div>
    <div class="footer__site">michaldokoupil.cz</div>
  </div>
</div>
</body>
</html>
